name: Import Nextis documentation

on:
  push:
    branches:
      - initial-import
    paths:
      - .bootstrap/import-ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          ref: initial-import
          fetch-depth: 0

      - name: Restore documentation archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* > /tmp/nextis-docs.tar.gz.b64
          base64 --decode /tmp/nextis-docs.tar.gz.b64 > /tmp/nextis-docs.tar.gz
          tar -xzf /tmp/nextis-docs.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/import-nextis.yml

      - name: Commit imported documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: import structured Nextis documentation"
          git push origin HEAD:initial-import
